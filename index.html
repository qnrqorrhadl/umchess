<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#bfe3f7">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>트릭컬 체스</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:only light;background:#cfe8f5}
@font-face{font-family:"Jua";src:url(Jua.woff2) format("woff2");font-display:swap}
html,body{margin:0;height:100%;color:#2b3a2e;font-family:"Jua",system-ui,"Noto Sans KR",sans-serif;font-synthesis:none}
button,input{font-family:inherit}
#app{max-width:560px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:100%}
#status{text-align:center;font-size:20px;font-weight:700;padding:8px;background:rgba(255,255,255,.82);color:#2b3a2e;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
#board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;border:4px solid #fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(40,70,100,.3)}
.crd{position:absolute;font-size:10px;font-weight:700;line-height:1;pointer-events:none;z-index:4;opacity:.7}
.sq.l .crd{color:#5a9a67}.sq.d .crd{color:#eef7ea}
.crd.rk{left:3px;top:2px}.crd.fl{left:3px;bottom:2px}
#status:empty{visibility:hidden}
#res{position:fixed;inset:0;z-index:34;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#res.on{display:flex}
#res .rays{display:none}
#res .rc{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(92vw,420px);padding:18px;background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.22);animation:resup .55s cubic-bezier(.2,1,.3,1)}
@keyframes resup{from{transform:translateY(100vh)}to{transform:none}}
#res img{max-width:100%;max-height:30vh;object-fit:contain}
#resTxt{font-size:56px;font-weight:900;letter-spacing:4px;line-height:1.1}
#res.win #resTxt{color:#2f8a46}#res.lose #resTxt{color:#5b6f95}#res.draw #resTxt{color:#7a8a7f}
#resWhy{color:#2b5a35;font-weight:800;font-size:16px;text-align:center}
#res .resb{display:flex;gap:10px;width:100%}
#res .resb button{flex:1}
#res .resb button:disabled{background:#c9cfca;color:#fff}
#vs{position:fixed;inset:0;z-index:36;background:rgba(10,5,30,.82);display:none;align-items:center;justify-content:center;gap:14px;color:#fff}
#vs.on{display:flex}
#vs .vp{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:36vw}
#vs .vp:first-child{animation:vsl .5s ease-out}#vs .vp:last-child{animation:vsr .5s ease-out}
#vs .vp img{width:min(30vw,130px);height:min(30vw,130px);border-radius:50%;object-fit:cover;border:5px solid #ffd24a;background:#fff;box-shadow:0 0 24px rgba(255,210,74,.7)}
#vs .vp b{font-size:20px;text-align:center;word-break:break-all;text-shadow:0 2px 4px #000}
#vs .vv{font-size:46px;font-weight:900;color:#ffd24a;text-shadow:0 0 16px #ff9d00,0 3px 6px #000;animation:vsp .6s ease-out}
@keyframes vsl{from{transform:translateX(-60vw)}to{transform:none}}
@keyframes vsr{from{transform:translateX(60vw)}to{transform:none}}
@keyframes vsp{0%{transform:scale(3);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
#coin{perspective:900px;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;font-size:22px;font-weight:700;text-align:center}
#coin.on{display:flex}
#coin .cn{position:relative;width:120px;height:120px;transform-style:preserve-3d;animation:cflip 1.9s linear}
#coin .cn img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid var(--cb,#ffd24a);background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.5);backface-visibility:hidden;-webkit-backface-visibility:hidden}
#coin.dk .cn img{filter:brightness(.55)}
#coin .cn .cf{transform:translateZ(5px)}
#coin .cn .cb{transform:rotateX(180deg) translateZ(5px)}
#coin .cn .sl{position:absolute;inset:0;border-radius:50%;background:#d9a21b;border:5px solid #b9830f}
@keyframes cflip{0%{transform:translateY(75vh) rotateX(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}42%{transform:translateY(-90px) rotateX(1260deg);animation-timing-function:cubic-bezier(.3,.5,.5,1)}100%{transform:translateY(0) rotateX(1800deg)}}
@keyframes chalo{0%{box-shadow:0 0 0 0 var(--hg,var(--hc)),0 0 0 0 var(--hg,var(--hc))}100%{box-shadow:0 0 18px 10px var(--hg,var(--hc)),0 0 50px 22px var(--hg,var(--hc))}}
#coin .rays{position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(from 0deg,var(--hc) 0 6deg,transparent 6deg 18deg);opacity:0;transition:opacity .35s;animation:cispin 4s linear infinite;pointer-events:none}
#coin.halo .rays{opacity:.3}
#coin.halo .cn img.cf{animation:chalo .7s ease-out forwards}
#coin .cn{z-index:1}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.l{background:#fafcf7}.sq.d{background:#7fba7a}
.sq.sel{background:#f6e05e!important}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,235,80,.35)}
.sq.chk{background:#e8504a!important}
.sq.hint::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(30,120,60,.55)}
.sq.hint.cap::after{width:92%;height:92%;background:none;border:4px solid rgba(200,40,40,.8)}
.piece{position:relative;width:88%;height:88%;border-radius:50%;pointer-events:none}
.piece img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.piece.w{box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.6)}
.piece.b{box-shadow:0 0 0 3px #111,0 2px 6px rgba(0,0,0,.6)}
.piece.tmW1{box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.6)}
.piece.tmW2{box-shadow:0 0 0 3px #111,0 2px 6px rgba(255,255,255,.5)}
.piece.tm .badge,.piece.tmW1 .badge,.piece.tmW2 .badge{background:#fff;color:#111}
.piece.w.old img{filter:brightness(1.12) saturate(1.05)}
.piece.b.old img{filter:brightness(.55) contrast(1.15)}
.piece.hb .badge{display:none}
.badge.bdg{right:2.5%;bottom:2.5%;width:31.7%;height:31.7%;z-index:3}
.badge{position:absolute;right:-4%;bottom:-4%;width:36%;height:36%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,3.6vw,18px);line-height:1;font-weight:900}
.w .badge{background:#fff;color:#111}.b .badge{background:#111;color:#fff}
#bar{display:flex;gap:8px}
button{flex:1;padding:12px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:#5fb36b;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18)}
button:active{background:#479455}
#wrap{position:relative;width:100%}
#arrow{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);pointer-events:none}
#bar button{padding-left:6px;padding-right:6px;white-space:nowrap}
#kb{display:none}
.sheet{display:grid;grid-template-columns:36px 1fr 1fr;align-content:start;background:rgba(255,255,255,.9);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow-y:auto;color:#2b3a2e;padding:2px 6px}
.sheet>span{min-height:36px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #e3ebe5;font-size:19px;line-height:1;padding:2px 4px;box-sizing:border-box}
.sheet .sn{color:#8a978c;font-size:15px;justify-content:flex-end;padding-right:6px}
.sheet .sh{position:sticky;top:0;z-index:1;background:#fff;color:#8a978c;font-size:14px;min-height:30px}
.sheet .sc.ks{color:#c2502e}
.sheet .sc.kl{text-decoration:underline;text-decoration-color:#ffc800;text-decoration-thickness:5px;text-underline-offset:4px}
.sheet .se{color:#8a978c;grid-column:1/4;padding:14px;border:0}
#kbo{position:fixed;inset:0;z-index:36;display:none;align-items:center;justify-content:center;background:rgba(20,30,40,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#kbo.on{display:flex}
#kbo .kbc{display:flex;flex-direction:column;width:min(90vw,340px);background:rgba(255,255,255,.97);border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:14px}
#kbo .kbh{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;color:#2b3a2e;padding:0 4px 10px}
#kbo .kbh button{flex:none;padding:8px 18px;font-size:16px}
#kbo .sheet{max-height:216px;padding:0 6px}
#kbo .sheet>span{min-height:36px}
#info{min-height:22px;text-align:center;font-size:16px;color:#2b5a35;font-weight:600}
#menu{position:fixed;inset:0;background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:9;display:flex;align-items:center;justify-content:center}
#menu .box{background:rgba(255,255,255,.92);padding:18px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.18);width:min(92vw,420px);display:flex;flex-direction:column;gap:12px;text-align:center}
#menu h1{margin:0 0 6px;font-size:30px}
#menu .sub{display:none;gap:8px}
#menu .sub.on{display:flex}
#menu button.off{background:#c9cfca;color:#fff}
#ver{text-align:center;color:#5a6f5e;font-size:13px;margin-top:-4px}
#menu small{color:#5a6f5e}
.pg{display:flex;flex-direction:column;gap:12px}.pg[hidden]{display:none}
#menu button.back{background:#9aa9a0}
#hint{background:#c9892b}
#promo{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:5}
#promo .box{background:#fff;color:#2b3a2e;padding:16px;border-radius:14px;text-align:center}
#promo .row{display:flex;gap:10px;margin-top:10px}
#promo .piece{width:64px;height:64px;pointer-events:auto;cursor:pointer}
body{-webkit-user-select:none;user-select:none}
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:50px;padding:4px 8px;background:rgba(255,255,255,.82);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tray:empty::before{content:attr(data-ph);color:#8a9a8d;font-size:13px}
.tray .tp{position:relative;width:38px;height:38px;cursor:pointer}
.tray .tp .piece{width:100%;height:100%}
.tray .tp.sel .piece{outline:3px solid #f6e05e}
.tray .sc{margin-left:auto;font-weight:900;color:#f6e05e;font-size:18px}
.tray .pa{display:inline-flex;align-items:center;gap:3px;margin-left:6px}
.tray .pa:only-child,.tray .tp+.pa{margin-left:auto}
.tray .pa img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #d36bff}
.tray .pa b{font-size:16px;color:#b04cf0}
#bar2{display:none;gap:8px}
#bar2.on{display:flex;flex-wrap:wrap}
#bar2 button{flex:1 1 30%}
#bar2 .rl{display:none}
body.rlab #bar2 .rl{display:block}
#bar2 button.on{background:#c9892b}
#bar2 button:disabled{background:#c9cfca;color:#fff}
body.freeon #wrap,body.freeon .tray{touch-action:none}
body.freeon .tray{outline:2px dashed #c9892b}
.ghost{position:fixed;width:58px;height:58px;transform:translate(-50%,-50%);z-index:30;pointer-events:none;opacity:.92}
.ghost .piece{width:100%;height:100%}
.joinrow{display:flex;gap:8px}
.half{display:flex;gap:8px}
#menu #nick{border:0;border-radius:12px;padding:12px;font-size:18px;text-align:center;background:#fff;color:#164a25;width:100%}
#menu .half button{flex:1;min-width:0;padding-left:4px;padding-right:4px}
#menu .joinrow input{flex:1;min-width:0;font-size:20px;text-align:center;border:0;border-radius:12px;padding:10px;background:#fff;color:#164a25;letter-spacing:4px}
#menu .joinrow button{flex:none;width:112px}
#menu .npw{border:0;border-radius:12px;padding:10px;font-size:18px;text-align:center;background:#fff;color:#164a25}
.nlh{display:flex;justify-content:space-between;align-items:center;color:#2b5a35}
.nlh button{flex:none;width:96px;padding:6px;font-size:14px}
#nList{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
#nList .rm{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 10px;text-align:left;color:#164a25;font-weight:700;font-size:15px}
#nList .rm span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nList .rm .rmk{flex:none;width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #ffd24a}
#nList .rm i{font-style:normal;font-size:12px;background:#c9892b;color:#fff;border-radius:8px;padding:2px 6px}
#nList .rm button{flex:none;width:72px;padding:6px;font-size:14px}
#nList .none{text-align:center;color:#6b8a72;font-size:14px;padding:8px}
#nStat{min-height:54px;font-size:18px;font-weight:900;text-align:center;color:#164a25;line-height:1.4;white-space:pre-line}
#nStat b{display:block;font-size:40px;letter-spacing:8px;color:#2f8a46}
.races2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager{display:flex;align-items:center;justify-content:center;gap:14px}
.pager b{font-size:16px;color:#2b5a35}
#menu .pager button{flex:none;width:56px;padding:8px}
#menu .rbtn.on{background:#3f8f50}
#menu .rbtn.on::before{content:"✓";position:absolute;left:8px;top:6px;width:24px;height:24px;border-radius:50%;background:#fff;color:#3f8f50;font-size:15px;display:flex;align-items:center;justify-content:center}
#menu .rbtn.off{background:#c9cfca;min-height:146px;justify-content:center}
#menu .rbtn.off i{font-size:16px;color:#fff}
#menu .rbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;background:#5fb36b}
#menu .rbtn i{font-style:normal;font-size:20px}
.rbtn .rimg{width:84px;height:84px;border-radius:50%;background:#fff;border:0;object-fit:cover}
.rbtn .mini{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:9px;border:0;object-fit:cover}
#skList{display:flex;flex-direction:column;gap:10px}
#menu .skopt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:8px;border-radius:12px;border:0;background:#a9dfb0;color:#164a25;font-size:15px;position:relative;box-shadow:none}
.skopt img{width:68px;height:68px;border-radius:10px;object-fit:cover;flex:none;border:0;background:#fff}
.skopt .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.skopt b{font-size:16px;font-weight:900}
.skopt span{font-size:13px;font-weight:600;line-height:1.3;white-space:pre-line}
.skopt em{font-style:normal;font-size:12px;font-weight:900;background:#5fb36b;color:#fff;border-radius:8px;padding:1px 7px;align-self:flex-start}
#menu .skopt.on{background:#4fa860;color:#fff}
#menu .skopt.on::after{content:"✓";position:absolute;right:8px;top:6px;color:#4fa860;background:#fff;width:22px;height:22px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center}
#menu .skopt.ex{background:#e4f3e1;cursor:default}
body.racem #info{display:none}
.colors,.skrow{display:flex;gap:8px;align-items:center}
.skrow{flex-wrap:wrap}.skrow span{flex:0 0 100%}.skrow button{white-space:nowrap;font-size:13px;padding:8px 4px}
.colors span,.skrow span{font-weight:700;color:#2b5a35;white-space:nowrap}
.colors button,.skrow button{padding:10px 6px;background:#8fc99a}
.colors button.on,.skrow button.on{background:#c9892b}
.gb{position:absolute;top:1px;right:1px;min-width:19px;height:19px;padding:0 3px;border-radius:10px;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#fff;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
.gb.g-ok{border:2px solid #fff;min-width:17px;height:17px;padding:0}
.gb.g-inacc{color:#3a2f00}
#bg{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:-1;pointer-events:none;will-change:transform;transform:translateZ(0);background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),var(--bg) center/cover no-repeat,#cfe8f5}

#skbar{display:none;justify-content:center;align-items:flex-end;gap:0;padding:6px 0 2px}
#skbar button.skcard,#skbar button.skcard:active{position:relative;flex:none;width:112px;height:142px;padding:0;border:3px solid #7cc98a;border-radius:14px;background:linear-gradient(#e6f8e1,#b4e4b9);box-shadow:0 4px 10px rgba(0,0,0,.3);overflow:visible;transform:rotate(var(--rot,0deg));transition:transform .15s,filter .15s;color:#6b3d00}
#skbar button.skcard:nth-child(1){--rot:-4deg}
#skbar button.skcard:nth-child(2){--rot:4deg;margin-left:-6px}
#skbar button.skcard:only-child,#skbar button.skcard[style*="display: none"]+*{--rot:0deg}
.skcard .cimg{position:absolute;left:4px;top:4px;width:calc(100% - 8px);height:calc(100% - 34px);object-fit:cover;border-radius:9px;background:#e6f7df}
.skcard .cname{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex;align-items:center;justify-content:center;background:#e9f8e3;color:#1c5a2c;font-weight:900;font-size:10px;line-height:1.1;text-align:center;padding:0 2px;border-radius:0 0 10px 10px;white-space:nowrap;overflow:hidden}
.skcard .cbadge{position:absolute;left:-7px;top:-7px;min-width:28px;height:28px;padding:0 4px;box-sizing:border-box;border-radius:14px;background:#5fb36b;border:3px solid #fff;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.skcard .cinfo{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #7cc98a;color:#3a8f4b;font-weight:900;font-size:13px;font-style:italic;display:flex;align-items:center;justify-content:center;z-index:3}
.skcard .cov{position:absolute;left:0;right:0;top:0;bottom:0;border-radius:11px;background:rgba(30,30,45,.62);color:#fff;font-weight:900;font-size:38px;display:none;align-items:center;justify-content:center;z-index:2;text-shadow:0 2px 4px #000}
.skcard.cd .cov{display:flex}
.skcard.off:not(.cd){filter:grayscale(.75) brightness(.9)}
.skcard.lock{filter:brightness(.6) saturate(.8)!important}
#skbar button.skcard.tgt{transform:translateY(-10px) rotate(var(--rot,0deg)) scale(1.05);border-color:#ff5a2a;box-shadow:0 0 0 3px rgba(255,90,42,.55),0 8px 14px rgba(0,0,0,.35)}
#skbar button.skcard:not(.off):not(.tgt){animation:rdy 1.6s ease-in-out infinite}
#skbar button.skcard.enh{border-color:#3a8ef5;background:linear-gradient(#e4f0ff,#a9cdf7)}
.skcard.enh .cname{background:#dcecff;color:#14407a}
.skcard.enh .cbadge{background:#3a8ef5}
.skcard.enh .cinfo{border-color:#3a8ef5;color:#2a6fd0}
.skcard.enh .cimg{background:#dcecff}
#skbar button.skcard.enh:not(.off):not(.tgt){animation:rdyb 1.4s ease-in-out infinite}
@keyframes rdyb{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.3),0 0 8px 2px rgba(58,142,245,.7)}50%{box-shadow:0 4px 10px rgba(0,0,0,.3),0 0 18px 7px rgba(58,142,245,1)}}
#skbar button.skcard.enh.cd,#skbar button.skcard.enh.off{box-shadow:0 4px 10px rgba(0,0,0,.3),0 0 12px 4px rgba(58,142,245,.8)}
@keyframes rdy{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.3)}50%{box-shadow:0 4px 10px rgba(0,0,0,.3),0 0 14px 4px rgba(255,214,90,.9)}}
#skinfo:empty{display:none}
#skinfo{min-height:18px;text-align:center;font-size:14px;font-weight:600;color:#5b3fb0}

/* ---------- 간단 AI (혼자 하기) ---------- */
const VAL={P:100,N:320,B:330,R:500,Q:900,K:0,S:0};
function evalS(s){
  let v=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=s.b[r][c];if(!p)continue;
    const t=typ(p),sg=col(p)==="w"?1:-1;
    let x=VAL[t];
    if(t==="N"||t==="B")x+=(7-Math.abs(2*r-7)-Math.abs(2*c-7))*3;
    if(t==="P")x+=(col(p)==="w"?6-r:r-1)*6+(c>=2&&c<=5?4:0);
    v+=sg*x;
  }
  return v;
}
function allMoves(s){const o=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=s.b[r][c];if(p&&col(p)===s.turn)for(const m of legal(s,r,c))o.push(m);}return o;}
function order(s,ms){
  const sc=m=>{const v=s.b[m.tr][m.tc];return (v?VAL[typ(v)]*10-VAL[typ(s.b[m.fr][m.fc])]:0)+(m.ep?900:0);};
  return ms.sort((a,b)=>sc(b)-sc(a));
}
function search(s,d,a,b){
  if(d===0)return (s.turn==="w"?1:-1)*evalS(s);
  const ms=allMoves(s);
  if(!ms.length)return inCheck(s,s.turn)?-100000-d:0;
  for(const m of order(s,ms)){
    const v=-search(apply(s,m),d-1,-b,-a);
    if(v>=b)return v;
    if(v>a)a=v;
  }
  return a;
}
function aiMove(){
  const ms=allMoves(S);
  ms.sort(()=>Math.random()-.5);
  let best=null,bs=-1e9;
  if(level===1&&Math.random()<.2){best=ms[0];}
  else{
    const d=level===1?1:level===2?2:3;
    for(const m of order(S,ms)){
      let v=-search(apply(S,m),d-1,-1e9,1e9);
      if(level===1)v+=Math.random()*120;
      if(v>bs){bs=v;best=m;}
    }
  }
  busy=false;
  doMove(best);
}

let sf=null,sfReady=null,sfLine=null;
function sfInit(){
  if(sfReady)return sfReady;
  sfReady=new Promise((res,rej)=>{
    try{sf=new Worker("stockfish-19-lite-single.js");}catch(e){rej(e);return;}
    sf.onerror=e=>rej(e);
    sf.onmessage=e=>{
      const l=String(e.data);
      if(l==="uciok"){sf.postMessage("setoption name MultiPV value 2");sf.postMessage("isready");}
      else if(l==="readyok")res();
      else if(sfLine)sfLine(l);
    };
    sf.postMessage("uci");
  });
  return sfReady;
}
function toFen(s){
  let f="";
  for(let r=0;r<8;r++){let e=0;
    for(let c=0;c<8;c++){const p=s.b[r][c];
      if(!p){e++;continue;}
      if(e){f+=e;e=0;}
      f+=col(p)==="w"?typ(p):typ(p).toLowerCase();}
    if(e)f+=e;if(r<7)f+="/";}
  let ca=(s.cast.wK?"K":"")+(s.cast.wQ?"Q":"")+(s.cast.bK?"k":"")+(s.cast.bQ?"q":"");
  const ep=s.ep?"abcdefgh"[s.ep.c]+(8-s.ep.r):"-";
  return `${f} ${s.turn} ${ca||"-"} ${ep} 0 1`;
}
const anCache=new Map();let anQ=Promise.resolve();
function analyze(s){
  const fen=toFen(s);
  if(anCache.has(fen))return Promise.resolve(anCache.get(fen));
  const job=anQ.then(()=>anCache.has(fen)?anCache.get(fen):sfInit().then(()=>new Promise(res=>{
    let cp=null,mate=null,cp2=null,mate2=null;
    sfLine=l=>{
      if(l.startsWith("info")&&/ score /.test(l)){
        const mp=l.match(/multipv (\d+)/),k=mp?+mp[1]:1;
        const m1=l.match(/score cp (-?\d+)/),m2=l.match(/score mate (-?\d+)/);
        if(k===1){if(m1){cp=+m1[1];mate=null;}else if(m2){mate=+m2[1];cp=null;}}
        else if(k===2){if(m1){cp2=+m1[1];mate2=null;}else if(m2){mate2=+m2[1];cp2=null;}}
      }else if(l.startsWith("bestmove")){
        sfLine=null;const r={best:l.split(" ")[1],cp,mate,cp2,mate2};
        if(anCache.size>400)anCache.clear();
        anCache.set(fen,r);res(r);
      }
    };
    sf.postMessage("position fen "+fen);
    sf.postMessage("go movetime 1000");
  })));
  anQ=job.catch(()=>{});
  return job;
}
const KN={P:"폰",N:"나이트",B:"비숍",R:"룩",Q:"퀸",K:"킹"};
function evalText(res,turn){
  const sg=turn==="w"?1:-1;
  if(res.mate!==null){const w=res.mate*sg>0;return `${w?"백":"흑"}이 ${Math.abs(res.mate)}수 안에 체크메이트!`;}
  const x=res.cp*sg/100;
  if(Math.abs(x)<.3)return "형세: 거의 비슷해요";
  return `형세: ${x>0?"백":"흑"}이 ${Math.abs(x).toFixed(1)} 유리`;
}

}

const BOOKS=BOOK.map(([n,m])=>({n,m:m.split(" ")}));
const uciOf=m=>"abcdefgh"[m.fc]+(8-m.fr)+"abcdefgh"[m.tc]+(8-m.tr);
function bookInfo(ln){
  const L=ln.length;let reached=null,path=null;
  for(const e of BOOKS){
    if(e.m.length<L)continue;
    if(ln.every((x,i)=>e.m[i]===x)){ if(!path)path=e; if(e.m.length===L){reached=e;break;} }
  }
  if(!path)return null;                       // 책에서 벗어남
  if(reached)return reached.n;
  // 아직 이름이 붙은 지점이 아니면, 지나온 가장 긴 정석 이름을 사용
  let best=null;
  for(const e of BOOKS){ if(e.m.length<=L&&e.m.every((x,i)=>ln[i]===x)&&(!best||e.m.length>best.m.length))best=e; }
  return best?best.n:path.n.split(":")[0];
}

const matOf=(s,c)=>{let v=0;for(let r=0;r<8;r++)for(let k=0;k<8;k++){const p=s.b[r][k];if(p&&col(p)===c)v+=PV[typ(p)];}return v;};
const matDiff=(s,c)=>matOf(s,c)-matOf(s,opp(c));
function replyOf(s,u4){
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=s.b[r][c];if(p&&col(p)===s.turn)for(const mm of legal(s,r,c))if(uciOf(mm)===u4)return mm;}
  return null;
}

function normalize(s){

  n.cast={wK:+(n.b[7][4]==="wK"&&n.b[7][7]==="wR"),wQ:+(n.b[7][4]==="wK"&&n.b[7][0]==="wR"),

function validate(s){
  let wk=0,bk=0;

    const p=s.b[r][c];if(!p)continue;
    if(p==="wK")wk++;if(p==="bK")bk++;
    if(typ(p)==="P"&&(r===0||r===7))return "폰이 맨 윗줄이나 맨 아랫줄에 있어요";
  }
  if(wk!==1||bk!==1)return "킹이 백·흑 하나씩 있어야 해요";
  if(inCheck(s,opp(s.turn)))return "차례가 아닌 쪽 킹이 체크 상태예요. 차례를 바꾸거나 기물을 옮겨주세요";

function gUrl(code,sub){return FB_URL.replace(/\/$/,"")+"/g/"+code+(sub||"")+".json";}
function fbConn(code,role,hk){
  const o={cid:Math.random().toString(36).slice(2,8),role,code,seen:new Set(),q:0,out:[],busy:false,closed:false,pn:0,lp:{v:null,at:0},got:false,stale:false};
  const pres=(r,v)=>{if(r===role)return;if(v!==o.lp.v){o.lp={v,at:Date.now()};o.got=true;if(o.stale){o.stale=false;if(hk.back)hk.back();}}};
  const msg=(k,m)=>{
    if(!m||typeof m!=="object"||o.seen.has(k))return;o.seen.add(k);if(m.s===role)return;
    const k2=m.s+m.c+":"+m.q;if(o.seen.has(k2))return;o.seen.add(k2);
    let d;try{d=JSON.parse(m.d);}catch(_){return;}
    if(!d||(d.to&&d.to!==o.cid))return;d._c=m.c;hk.msg(d);};
  const walk=(p,d)=>{
    const a=String(p||"/").split("/").filter(Boolean);
    if(!a.length){if(d&&typeof d==="object"){if(d.m)Object.keys(d.m).sort().forEach(k=>msg(k,d.m[k]));if(d.p)Object.keys(d.p).forEach(r=>pres(r,d.p[r]));}}
    else if(a[0]==="m"){if(a.length===1){if(d&&typeof d==="object")Object.keys(d).sort().forEach(k=>msg(k,d[k]));}else msg(a[1],d);}
    else if(a[0]==="p"){if(a.length===1){if(d&&typeof d==="object")Object.keys(d).forEach(r=>pres(r,d[r]));}else pres(a[1],d);}
  };
  const es=new EventSource(gUrl(code));o.es=es;
  es.addEventListener("open",()=>{if(hk.open)hk.open();});
  es.addEventListener("put",e=>{try{const j=JSON.parse(e.data);walk(j.path,j.data);}catch(_){}});
  es.addEventListener("patch",e=>{try{const j=JSON.parse(e.data);if(j.data&&typeof j.data==="object")Object.keys(j.data).forEach(k=>walk(String(j.path).replace(/\/$/,"")+"/"+k,j.data[k]));}catch(_){}});
  const pump=()=>{
    if(o.busy||!o.out.length||o.closed)return;o.busy=true;
    fetch(gUrl(code,"/m"),{method:"POST",body:JSON.stringify(o.out[0])}).then(r=>{if(!r.ok)throw 0;o.out.shift();o.busy=false;pump();}).catch(()=>{o.busy=false;setTimeout(pump,1500);});
  };
  const ping=()=>{if(o.closed)return;fetch(gUrl(code,"/p/"+role),{method:"PUT",body:String(++o.pn)}).catch(()=>{});};
  o.pt=setInterval(ping,8000);ping();
  o.st=setInterval(()=>{if(o.got&&!o.stale&&Date.now()-o.lp.at>40000){o.stale=true;if(hk.lost)hk.lost();}},5000);
  o.send=obj=>{o.out.push({s:role,c:o.cid,q:++o.q,d:JSON.stringify(obj),t:Date.now()});pump();};
  o.close=leave=>{
    if(o.closed)return;
    const fin=()=>{o.closed=true;try{es.close();}catch(_){}clearInterval(o.pt);clearInterval(o.st);if(role==="h"){try{fetch(gUrl(code),{method:"DELETE",keepalive:true}).catch(()=>{});}catch(_){}}};
    if(leave){o.send({t:"leave"});setTimeout(fin,900);}else fin();
  };
  return o;
}
